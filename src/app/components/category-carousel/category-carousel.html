<section class="py-8">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <h3 class="mb-6 text-2xl font-bold text-color">
      <i class="fas fa-filter mr-2 text-amber-500"></i>
      Explora por Categoría
    </h3>

    <!-- Carrusel de Categorías -->
    <div class="relative group">
      <!-- Botón de navegación izquierda -->
      <button
        (click)="scrollLeft()"
        class="absolute left-0 top-0 h-full z-10 w-12 bg-gradient-to-r to-transparent text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-start pl-2"
        aria-label="Scroll left"
      >
        <i class="fas fa-chevron-left text-3xl"></i>
      </button>

      <!-- Contenedor de scroll -->
      <div
        class="category-scroll-container flex gap-4 overflow-x-auto pb-4 scroll-smooth"
        style="scrollbar-width: none; -ms-overflow-style: none"
      >
        @for (category of categories(); track category.name) {
          <div
            (click)="selectCategory(category.name)"
            class="category-card flex-shrink-0 w-48 h-32 rounded-xl shadow-lg overflow-hidden cursor-pointer transform transition-all duration-300 hover:scale-105 hover:shadow-2xl relative"
          >
            <img
              [src]="category.imageUrl"
              [alt]="category.name"
              class="absolute inset-0 w-full h-full object-cover"
            />
          </div>
        }
      </div>

      <!-- Botón de navegación derecha -->
      <button
        (click)="scrollRight()"
        class="absolute right-0 top-0 h-full z-10 w-12 bg-gradient-to-l to-transparent text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-end pr-2"
        aria-label="Scroll right"
      >
        <i class="fas fa-chevron-right text-3xl"></i>
      </button>
    </div>
  </div>
</section>
