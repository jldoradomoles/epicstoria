@if (!imageUrl()) {
  <!-- La Columna de Herodoto — Home Hero -->
  <section
    id="inicio"
    class="hero-column"
    [style.background-image]="'url(\'' + backgroundImageUrl() + '\')'"
  ></section>
} @else {
  <!-- Compact/image hero for sub-pages -->
  <main
    id="inicio"
    class="hero-background relative overflow-hidden bg-cover bg-center bg-no-repeat"
    [class.hero-compact]="noMainImage()"
    [style.background-image]="'url(\'' + backgroundImageUrl() + '\')'"
  >
    <div class="relative z-10 mx-auto max-w-7xl px-4 text-center sm:px-6 lg:px-8"></div>
  </main>
}
